<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#7DD3FC" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space rounded plate -->
  <rect width="32" height="32" rx="7" fill="url(#spaceBg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Outer luminous cosmic aura -->
  <circle cx="16" cy="16" r="9" fill="url(#coreGlow)" opacity="0.75" filter="url(#glow)"/>

  <!-- Secondary diagonal star rays -->
  <path d="M16 10 Q16 16 10 16 Q16 16 16 22 Q16 16 22 16 Q16 16 16 10 Z" transform="rotate(45 16 16)" fill="#7DD3FC" opacity="0.85" />

  <!-- Primary 4-pointed celestial pulsar star -->
  <path d="M16 4 Q16 16 4 16 Q16 16 16 28 Q16 16 28 16 Q16 16 16 4 Z" fill="#38BDF8" filter="url(#glow)" />
  <path d="M16 6.5 Q16 16 6.5 16 Q16 16 16 25.5 Q16 16 25.5 16 Q16 16 16 6.5 Z" fill="#FFFFFF" />

  <!-- Radiant central core -->
  <circle cx="16" cy="16" r="2" fill="#FFFFFF" />
</svg>
